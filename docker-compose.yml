services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./Back-End
    restart: unless-stopped
    env_file:
      - ./Back-End/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/huraymila-demo
      MONGO_URI_LOCAL: mongodb://mongo:27017/huraymila-demo
      FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:8080}
    volumes:
      - api_public:/app/public
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./Front-End
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  api_public:
